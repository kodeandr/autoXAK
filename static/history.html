<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="manifest" href="/static/manifest.json">
    <link rel="apple-touch-icon" href="/static/icon-192.png">
    <link rel="icon" href="data:,">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#121417">
    <title>autoXAK — История поездок</title>
    <style>
        :root {
            --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", sans-serif;
            --font-mono: "Space Grotesk", "Geist Mono", ui-monospace, monospace;
            --bg-screen: #121417;
            --bg-surface: #1E2228;
            --bg-surface-elevated: #262B33;
            --accent-lime: #D2FA58;
            --accent-lime-hover: #C2EA48;
            --accent-blue: #38BDF8;
            --accent-amber: #F59E0B;
            --accent-danger: #EF4444;
            --text-primary: #FFFFFF;
            --text-secondary: #8E95A2;
            --text-muted: #5E6472;
            --border-soft: rgba(148, 163, 184, 0.12);
            --border-strong: rgba(148, 163, 184, 0.32);
            --radius-btn: 16px;
            --radius-input: 14px;
            --radius-card: 20px;
            --radius-pill: 9999px;
            --shadow-card: 0 14px 36px rgba(0, 0, 0, 0.65);
        }

        *, *::before, *::after {
            box-sizing: border-box; margin: 0; padding: 0;
            font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; user-select: none;
        }

        body {
            background-color: #000000;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; color: var(--text-primary);
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            overflow: hidden;
        }

        .mobile-container {
            width: 100%; max-width: 414px; height: 100vh; max-height: 890px;
            background-color: var(--bg-screen); border: 1px solid var(--border-soft);
            border-radius: 44px; box-shadow: 0 0 60px rgba(0, 0, 0, 0.95);
            display: flex; flex-direction: column; overflow: hidden; position: relative;
        }

        /* ---------------- НАВИГАЦИОННАЯ ШАПКА ---------------- */
        .top-nav {
            padding: 20px 20px 14px; display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid var(--border-soft); background: var(--bg-screen); z-index: 10;
        }
        .btn-back {
            background: none; border: none; color: var(--text-primary);
            font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px;
            cursor: pointer; text-decoration: none; padding: 4px 0; transition: color 0.2s;
        }
        .btn-back:hover { color: var(--accent-lime); }
        .nav-title { font-size: 15px; font-weight: 700; color: var(--text-primary); }
        .nav-placeholder { width: 48px; }

        /* ---------------- СКРОЛЛ-КОНТЕНТ ---------------- */
        .content-scroll {
            flex-grow: 1; overflow-y: auto; padding: 20px 18px 40px;
            display: flex; flex-direction: column; gap: 16px; scrollbar-width: none;
        }
        .content-scroll::-webkit-scrollbar { display: none; }

        /* ГЛАВНАЯ НАКОПИТЕЛЬНАЯ КАРТОЧКА */
        .hero-savings-card {
            background: var(--bg-surface); border: 1px solid var(--border-soft);
            border-radius: var(--radius-card); padding: 22px 20px; box-shadow: var(--shadow-card);
            display: flex; flex-direction: column; gap: 8px;
        }
        .hero-label {
            font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px;
            color: var(--accent-lime); font-weight: 800;
        }
        .hero-amount-row {
            display: flex; align-items: baseline; gap: 4px; font-family: var(--font-mono); margin: 4px 0;
        }
        .hero-prefix { font-size: 26px; color: var(--accent-lime); font-weight: 700; }
        .hero-digits { font-size: 44px; font-weight: 800; color: var(--text-primary); letter-spacing: -1px; }
        .hero-unit { font-size: 24px; color: var(--accent-lime); font-weight: 700; margin-left: 2px; }

        .hero-stats-grid {
            display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
            border-top: 1px solid var(--border-soft); padding-top: 12px; margin-top: 6px;
        }
        .hero-stat-cell { display: flex; flex-direction: column; gap: 2px; }
        .hero-stat-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }
        .hero-stat-val { font-family: var(--font-mono); font-size: 14px; font-weight: 700; color: var(--text-primary); }

        /* ФИЛЬТРЫ ПЕРИОДА */
        .period-chips {
            display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
        }
        .period-chip {
            padding: 8px 16px; background: var(--bg-surface); border: 1px solid var(--border-soft);
            border-radius: var(--radius-pill); font-size: 12px; font-weight: 600; color: var(--text-secondary);
            cursor: pointer; transition: all 0.2s; white-space: nowrap;
        }
        .period-chip.active {
            background: rgba(210, 250, 88, 0.14); border-color: var(--accent-lime); color: var(--accent-lime);
        }

        /* СПИСОК КАРТОЧЕК ПОЕЗДОК */
        .trips-section-title {
            font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
            color: var(--text-muted); margin-top: 4px;
        }
        .trips-list { display: flex; flex-direction: column; gap: 12px; }

        .trip-card {
            background: var(--bg-surface); border: 1px solid var(--border-soft);
            border-radius: var(--radius-btn); padding: 16px; display: flex;
            flex-direction: column; gap: 10px; transition: border-color 0.2s;
        }
        .trip-card:hover { border-color: var(--border-strong); }

        .trip-header { display: flex; justify-content: space-between; align-items: center; }
        .trip-date { font-size: 12px; color: var(--text-secondary); font-weight: 500; }
        .trip-duration { font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); }

        .trip-main-row {
            display: flex; justify-content: space-between; align-items: baseline;
        }
        .trip-distance-box { display: flex; align-items: baseline; gap: 4px; }
        .trip-distance-val { font-family: var(--font-mono); font-size: 20px; font-weight: 800; color: var(--text-primary); }
        .trip-distance-unit { font-size: 12px; color: var(--text-secondary); font-weight: 600; }

        .trip-savings-val {
            font-family: var(--font-mono); font-size: 20px; font-weight: 800; color: var(--accent-lime);
        }

        .trip-tags-row {
            display: flex; flex-wrap: wrap; gap: 6px; border-top: 1px solid var(--border-soft);
            padding-top: 8px; font-size: 11px;
        }
        .trip-tag {
            padding: 4px 8px; border-radius: 8px; background: var(--bg-screen);
            border: 1px solid var(--border-soft); display: flex; align-items: center; gap: 4px;
        }
        .trip-tag.smooth { color: var(--accent-lime); border-color: rgba(210, 250, 88, 0.25); }
        .trip-tag.rush { color: var(--accent-amber); border-color: rgba(245, 158, 11, 0.25); }
        .trip-tag.bump { color: var(--accent-blue); border-color: rgba(56, 189, 248, 0.25); }

        /* ПУСТОЕ СОСТОЯНИЕ */
        .empty-state {
            padding: 48px 20px; display: none; flex-direction: column; align-items: center;
            text-align: center; gap: 12px;
        }
        .empty-state.active { display: flex; }
        .empty-icon { font-size: 40px; }
        .empty-title { font-size: 16px; font-weight: 700; color: var(--text-primary); }
        .empty-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.4; max-width: 260px; }
        .btn-empty-start {
            margin-top: 8px; padding: 12px 24px; background: var(--accent-lime); color: #121417;
            border-radius: var(--radius-btn); text-decoration: none; font-size: 13px; font-weight: 800;
        }
    </style>
</head>
<body>
    <main class="mobile-container">
        <!-- НАВИГАЦИОННАЯ ШАПКА -->
        <header class="top-nav">
            <a href="/" class="btn-back">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                <span>Назад</span>
            </a>
            <span class="nav-title">История поездок</span>
            <div class="nav-placeholder"></div>
        </header>

        <!-- ОСНОВНОЙ КОНТЕНТ -->
        <section class="content-scroll">
            <!-- СУММАРНЫЙ БАНК СБЕРЕЖЕНИЙ (ПУНКТ 8 ЗОИ) -->
            <article class="hero-savings-card">
                <span class="hero-label">Суммарная экономия</span>
                <div class="hero-amount-row">
                    <span class="hero-prefix">+</span>
                    <span class="hero-digits" id="total-savings-val">0.00</span>
                    <span class="hero-unit">₽</span>
                </div>
                <div class="hero-stats-grid">
                    <div class="hero-stat-cell">
                        <span class="hero-stat-label">Поездок</span>
                        <span class="hero-stat-val" id="total-trips-val">0</span>
                    </div>
                    <div class="hero-stat-cell">
                        <span class="hero-stat-label">Пробег</span>
                        <span class="hero-stat-val" id="total-distance-val">0.0 км</span>
                    </div>
                    <div class="hero-stat-cell">
                        <span class="hero-stat-label">Топливо</span>
                        <span class="hero-stat-val" id="total-fuel-val">0.0 л</span>
                    </div>
                </div>
            </article>

            <!-- ПЕРЕКЛЮЧАТЕЛЬ ПЕРИОДОВ -->
            <div class="period-chips">
                <button class="period-chip active" onclick="setPeriod(30, this)">За 30 дней</button>
                <button class="period-chip" onclick="setPeriod(7, this)">За 7 дней</button>
                <button class="period-chip" onclick="setPeriod(365, this)">За все время</button>
            </div>

            <div class="trips-section-title">Список заездов</div>

            <!-- СПИСОК ПОЕЗДОК -->
            <div class="trips-list" id="trips-list">
                <!-- Карточки генерируются скриптом -->
            </div>

            <!-- ПУСТОЙ ЭКРАН -->
            <div class="empty-state" id="empty-state">
                <div class="empty-icon">🚗💨</div>
                <div class="empty-title">Поездок пока нет</div>
                <div class="empty-desc">Совершите первую поездку, чтобы увидеть финансовую аналитику своего стиля вождения.</div>
                <a href="/" class="btn-empty-start">Начать поездку</a>
            </div>
        </section>
    </main>

    <script>
        'use strict';

        let currentUserId = localStorage.getItem('autoXAK_user_id') || 'test_user_01';
        let currentPeriodDays = 30;

        function formatDateTime(isoString) {
            if (!isoString) return 'Недавняя поездка';
            const date = new Date(isoString);
            const now = new Date();
            const isToday = date.toDateString() === now.toDateString();

            const timeStr = date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
            if (isToday) return `Сегодня, ${timeStr}`;

            const dateStr = date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
            return `${dateStr}, ${timeStr}`;
        }

        function formatDuration(seconds) {
            const sec = Math.round(Number(seconds) || 0);
            if (sec < 60) return `${sec} с`;
            const min = Math.floor(sec / 60);
            return `${min} мин`;
        }

        async function loadHistoryData() {
            const listEl = document.getElementById('trips-list');
            const emptyEl = document.getElementById('empty-state');

            try {
                // 1. Загрузка агрегатов периода
                const endDate = new Date();
                const startDate = new Date();
                startDate.setDate(endDate.getDate() - currentPeriodDays);

                const periodUrl = `/api/v1/users/${encodeURIComponent(currentUserId)}/analytics/period?start_date=${startDate.toISOString()}&end_date=${endDate.toISOString()}`;
                const res = await fetch(periodUrl);
                
                if (!res.ok) throw new Error('Сбой загрузки данных аналитики');
                const data = await res.json();

                // 2. Обновление сводной карточки
                const summary = data.summary || {};
                document.getElementById('total-savings-val').innerText = Number(summary.total_savings_rub || 0).toFixed(2);
                document.getElementById('total-trips-val').innerText = summary.total_trips || 0;
                document.getElementById('total-distance-val').innerText = `${Number(summary.total_distance_km || 0).toFixed(1)} км`;
                document.getElementById('total-fuel-val').innerText = `${Number(summary.total_fuel_saved_liters || 0).toFixed(1)} л`;

                // 3. Рендер списка поездок
                const trips = data.trips || [];
                listEl.innerHTML = '';

                if (trips.length === 0) {
                    emptyEl.classList.add('active');
                    listEl.style.display = 'none';
                    return;
                }

                emptyEl.classList.remove('active');
                listEl.style.display = 'flex';

                trips.forEach(trip => {
                    const card = document.createElement('div');
                    card.className = 'trip-card';

                    const savingsRub = Number(trip.total_savings_rub || 0).toFixed(2);
                    const distanceKm = Number(trip.distance_km || 0).toFixed(2);
                    const smoothScore = trip.smooth_score || 100;
                    const rushPenalty = Number(trip.rush_cost_rub || 0);
                    const harshCount = (trip.harsh_accel_count || 0) + (trip.harsh_brake_count || 0);
                    const bumpsCount = trip.road_anomalies_count || 0;

                    let tagsHtml = `
                        <div class="trip-tag smooth">
                            <span>★</span> Плавность: ${smoothScore}/100
                        </div>
                    `;

                    if (rushPenalty > 0) {
                        tagsHtml += `
                            <div class="trip-tag rush">
                                <span>⚠️</span> ${harshCount} резких (-${rushPenalty.toFixed(2)} ₽)
                            </div>
                        `;
                    }

                    if (bumpsCount > 0) {
                        tagsHtml += `
                            <div class="trip-tag bump">
                                <span>🛡️</span> Неровностей: ${bumpsCount}
                            </div>
                        `;
                    }

                    card.innerHTML = `
                        <div class="trip-header">
                            <span class="trip-date">${formatDateTime(trip.created_at)}</span>
                            <span class="trip-duration">${formatDuration(trip.duration_seconds)}</span>
                        </div>
                        <div class="trip-main-row">
                            <div class="trip-distance-box">
                                <span class="trip-distance-val">${distanceKm}</span>
                                <span class="trip-distance-unit">км</span>
                            </div>
                            <span class="trip-savings-val">+${savingsRub} ₽</span>
                        </div>
                        <div class="trip-tags-row">
                            ${tagsHtml}
                        </div>
                    `;

                    listEl.appendChild(card);
                });

            } catch (err) {
                console.warn('Ошибка загрузки истории:', err);
                emptyEl.classList.add('active');
            }
        }

        function setPeriod(days, btn) {
            currentPeriodDays = days;
            document.querySelectorAll('.period-chip').forEach(c => c.classList.remove('active'));
            if (btn) btn.classList.add('active');
            loadHistoryData();
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadHistoryData();
        });
    </script>
</body>
</html>
