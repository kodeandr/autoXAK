<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>autoXAK — История поездок</title>
    <script src="/static/session.js"></script>
    <style>
        :root {
            --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", system-ui, sans-serif;
            --bg-root: #121316;
            --bg-card: #1C1E22;
            --bg-modal: #22252A;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-card: rgba(255, 255, 255, 0.07);
            --lime: #D2FA58;
            --lime-dim-bg: #262C1A;
            --text-primary: #FFFFFF;
            --text-secondary: #8C919B;
            --radius-md: 16px;
            --radius-lg: 22px;
            --radius-xl: 26px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-sans);
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #08090B;
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
            overscroll-behavior: none;
        }

        .mobile-container {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            background-color: var(--bg-root);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        

        .history-scroll {
            flex: 1;
            overflow-y: auto;
            padding: max(20px, env(safe-area-inset-top)) 16px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scrollbar-width: none;
        }
        .history-scroll::-webkit-scrollbar { display: none; }

        .page-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            padding: 6px 4px 0;
            letter-spacing: -0.3px;
        }

        /* Карточка "Моя копилка" (Макет 10) */
        .piggy-bank-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: var(--radius-lg);
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .piggy-top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .piggy-title {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .wallet-icon {
            width: 22px;
            height: 22px;
            color: var(--lime);
        }

        .piggy-total-val {
            font-size: 44px;
            font-weight: 700;
            color: var(--lime);
            letter-spacing: -1px;
            line-height: 1.1;
            margin-bottom: 12px;
            font-variant-numeric: tabular-nums;
        }

        .piggy-trips-count {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* Секция списка поездок */
        .list-section-label {
            font-size: 13px;
            color: var(--text-secondary);
            padding: 2px 4px 0;
        }

        .trips-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .trip-row-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 18px;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .trip-row-left {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .trip-row-amount {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
        }

        .trip-row-date {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .btn-trip-details {
            background: none;
            border: none;
            color: var(--lime);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            padding: 8px 0 8px 12px;
        }

        .empty-history {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 18px;
            padding: 32px 20px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* Нижняя панель навигации */
        .bottom-tab-bar {
            height: calc(64px + env(safe-area-inset-bottom));
            padding-bottom: env(safe-area-inset-bottom);
            border-top: 1px solid var(--border-subtle);
            background: var(--bg-root);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            align-items: center;
            justify-items: center;
            flex-shrink: 0;
            z-index: 20;
        }

        .tab-item {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 32px;
            border-radius: 16px;
            color: var(--text-secondary);
            text-decoration: none;
            cursor: pointer;
        }

        .tab-item.active {
            background: var(--lime-dim-bg);
            color: var(--lime);
        }

        .tab-item svg {
            width: 20px;
            height: 20px;
        }

        /* ---------------- МОДАЛКА "ПОДРОБНЕЕ" (МАКЕТ 9) ---------------- */
        .details-modal-overlay {
            position: absolute;
            inset: 0;
            background: rgba(8, 9, 11, 0.72);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px 16px calc(74px + env(safe-area-inset-bottom));
        }
        .details-modal-overlay.active {
            display: flex;
        }

        .details-modal-card {
            width: 100%;
            background: var(--bg-modal);
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: var(--radius-xl);
            padding: 22px 18px 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85);
        }

        .details-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .details-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .btn-close-details {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .details-date {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 22px;
        }

        .details-big-amount {
            font-size: 46px;
            font-weight: 700;
            color: var(--text-primary);
            text-align: center;
            letter-spacing: -1px;
            line-height: 1.1;
            margin-bottom: 8px;
            font-variant-numeric: tabular-nums;
        }

        .details-sub-caption {
            font-size: 13px;
            color: var(--text-secondary);
            text-align: center;
            line-height: 1.4;
            margin-bottom: 22px;
        }

        .stats-grid-6 {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .stat-cell {
            background: #2A2D34;
            border-radius: 14px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-cell-val {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
        }

        .stat-cell-label {
            font-size: 11px;
            color: var(--text-secondary);
        }
            html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            background-color: var(--bg-root, var(--bg-screen, #121316));
            margin: 0;
            padding: 0;
            overflow: hidden;
            overscroll-behavior: none;
        }

        .mobile-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            height: 100dvh;
            max-height: none !important;
            margin: 0 auto;
            border: none !important;
            border-radius: 0 !important;
            box-shadow: none !important;
        }
    </style>
</head>
<body>

<div class="mobile-container">

    <div class="history-scroll">
        <h1 class="page-title">История поездок</h1>

        <!-- Карточка "Моя копилка" -->
        <div class="piggy-bank-card">
            <div class="piggy-top-row">
                <span class="piggy-title">Моя копилка</span>
                <svg class="wallet-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"/>
                    <path d="M4 6v12c0 1.1.9 2 2 2h14v-4"/>
                    <path d="M18 12a2 2 0 0 0-2 2c0 1.1.9 2 2 2h4v-4h-4z"/>
                </svg>
            </div>
            <div class="piggy-total-val" id="hist-total-savings">+0.00 ₽</div>
            <div class="piggy-trips-count" id="hist-trips-count">0 поездок</div>
        </div>

        <div class="list-section-label">Расчетная экономия по поездкам</div>

        <div class="trips-list" id="hist-trips-list">
            <div class="empty-history">Загрузка поездок...</div>
        </div>
    </div>

    <!-- Модальное окно "Подробнее" (Макет 9) -->
    <div class="details-modal-overlay" id="details-modal" onclick="handleBackdropClick(event)">
        <div class="details-modal-card">
            <div class="details-header">
                <span class="details-title">Подробнее</span>
                <button class="btn-close-details" onclick="closeDetailsModal()" aria-label="Закрыть">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="details-date" id="det-date">17 октября, 12:30</div>

            <div class="details-big-amount" id="det-savings">+0.00 ₽</div>
            <div class="details-sub-caption">
                Сэкономлено на топливе<br>относительно лихача
            </div>

            <div class="stats-grid-6">
                <div class="stat-cell">
                    <span class="stat-cell-val" id="det-starts">0</span>
                    <span class="stat-cell-label">Резкие старты</span>
                </div>
                <div class="stat-cell">
                    <span class="stat-cell-val" id="det-brakes">0</span>
                    <span class="stat-cell-label">Резкие торможения</span>
                </div>
                <div class="stat-cell">
                    <span class="stat-cell-val" id="det-idle">0 мин</span>
                    <span class="stat-cell-label">Время в пробках</span>
                </div>
                <div class="stat-cell">
                    <span class="stat-cell-val" id="det-bumps">0</span>
                    <span class="stat-cell-label">Неровности</span>
                </div>
                <div class="stat-cell">
                    <span class="stat-cell-val" id="det-distance">0 км</span>
                    <span class="stat-cell-label">Дистанция</span>
                </div>
                <div class="stat-cell">
                    <span class="stat-cell-val" id="det-duration">0 ч 00 мин</span>
                    <span class="stat-cell-label">Время поездки</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Нижняя панель навигации -->
    <nav class="bottom-tab-bar">
        <a href="/history" class="tab-item active" aria-label="История поездок">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                <path d="M3 3v5h5"/>
                <path d="M12 7v5l4 2"/>
            </svg>
        </a>
        <a href="/" class="tab-item" aria-label="Главный экран">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1V9.5z"/>
            </svg>
        </a>
        <a href="/setup" class="tab-item" aria-label="Мой автомобиль">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 16H9m10 0h3v-3.15a1 1 0 0 0-.84-.99L16 11l-2.7-3.6a1 1 0 0 0-.8-.4H5.24a2 2 0 0 0-1.8 1.1l-.8 1.63A6 6 0 0 0 2 12.42V16h2"/>
                <circle cx="6.5" cy="16.5" r="2.5"/>
                <circle cx="16.5" cy="16.5" r="2.5"/>
            </svg>
        </a>
    </nav>

</div>

<script>
    let userId = '';
    let loadedTrips = [];

    function pluralizeTrips(count) {
        const mod10 = count % 10;
        const mod100 = count % 100;
        if (mod10 === 1 && mod100 !== 11) return `${count} поездка`;
        if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return `${count} поездки`;
        return `${count} поездок`;
    }

    function formatRuDateTime(isoString) {
        const d = new Date(isoString);
        if (isNaN(d.getTime())) return 'Сегодня';
        const datePart = d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
        const timePart = d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        return `${datePart}, ${timePart}`;
    }

    function formatDurationHoursMins(totalSec) {
        const sec = Math.max(0, Number(totalSec) || 0);
        const hrs = Math.floor(sec / 3600);
        const mins = Math.floor((sec % 3600) / 60);
        return `${hrs} ч ${String(mins).padStart(2, '0')} мин`;
    }

    function getLocalDetailsMap() {
        try {
            return JSON.parse(localStorage.getItem('autoXAK_trip_details_map') || '{}');
        } catch (e) {
            return {};
        }
    }

    function getLocalOfflineTrips() {
        try {
            return JSON.parse(localStorage.getItem('autoXAK_offline_trips') || '[]').filter(trip => trip.user_id === userId);
        } catch (e) {
            return [];
        }
    }

    async function fetchHistory() {
        const session = await AutoXAKSession.ensureAuthenticated();
        userId = session.userId;
        const localDetails = getLocalDetailsMap();
        const offlineList = getLocalOfflineTrips();

        let serverTrips = [];
        let serverTotalRub = 0;

        try {
            const res = await fetch(`/api/v1/users/${encodeURIComponent(userId)}/analytics/period`, {headers: AutoXAKSession.getAuthHeaders()});
            if (res.ok) {
                const data = await res.json();
                serverTrips = Array.isArray(data.trips) ? data.trips : [];
                serverTotalRub = Number(data.summary?.total_savings_rub) || 0;
            }
        } catch (err) {
            console.warn('Оффлайн режим истории:', err);
        }

        // Объединяем оффлайн-поездки и серверные поездки без дублей
        const seenIds = new Set();
        const merged = [];

        for (const trip of serverTrips) {
            const sid = trip.session_id || trip.id;
            if (sid) seenIds.add(sid);
            merged.push({...localDetails[sid], ...trip});
        }
        for (const trip of offlineList) {
            if (!seenIds.has(trip.session_id)) { merged.push(trip); seenIds.add(trip.session_id); }
        }
        merged.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

        // Если сервер пуст и оффлайн-очередь пуста, проверяем локальный архив
        if (merged.length === 0) {
            try {
                const localArchive = JSON.parse(localStorage.getItem('autoXAK_local_history') || '[]');
                for (const item of localArchive) if (item.user_id === userId) merged.push(item);
            } catch (e) {}
        }

        loadedTrips = merged;

        const totalRub = merged.reduce((acc, t) => acc + (Number(t.total_savings_rub) || 0), 0) || serverTotalRub;
        document.getElementById('hist-total-savings').innerText = `+${totalRub.toFixed(2)} ₽`;
        document.getElementById('hist-trips-count').innerText = pluralizeTrips(merged.length);

        renderTripsList(merged);
    }

    function renderTripsList(trips) {
        const container = document.getElementById('hist-trips-list');
        if (!trips || trips.length === 0) {
            container.innerHTML = `<div class="empty-history">Поездок пока нет. Начните первую поездку на главном экране.</div>`;
            return;
        }

        container.innerHTML = trips.map((t, idx) => {
            const rub = (Number(t.total_savings_rub) || 0).toFixed(2);
            const dateStr = formatRuDateTime(t.created_at);
            return `
                <div class="trip-row-card">
                    <div class="trip-row-left">
                        <span class="trip-row-amount">+${rub} ₽</span>
                        <span class="trip-row-date">${dateStr}</span>
                    </div>
                    <button class="btn-trip-details" onclick="openDetailsModal(${idx})">Подробнее</button>
                </div>
            `;
        }).join('');
    }

    function openDetailsModal(index) {
        const t = loadedTrips[index];
        if (!t) return;

        const rub = (Number(t.total_savings_rub) || 0).toFixed(2);
        const durSec = Number(t.duration_seconds) || 0;
        const idleMin = t.idle_minutes !== undefined
            ? t.idle_minutes
            : Math.round(((Number(t.idle_ratio) || 0) * durSec) / 60);
        const distance = Math.max(0,Number(t.distance_km)||0);
        const distLabel = distance>0 && distance<1 ? `${Math.round(distance*1000)} м` : `${distance.toFixed(1).replace(/\.0$/,'')} км`;

        document.getElementById('det-date').innerText = formatRuDateTime(t.created_at);
        document.getElementById('det-savings').innerText = `+${rub} ₽`;
        document.getElementById('det-starts').innerText = String(t.hard_accel_count ?? 0);
        document.getElementById('det-brakes').innerText = String(t.hard_brake_count ?? 0);
        document.getElementById('det-idle').innerText = `${idleMin} мин`;
        document.getElementById('det-bumps').innerText = String(t.bumps_count ?? t.z_veto_count ?? 0);
        document.getElementById('det-distance').innerText = distLabel;
        document.getElementById('det-duration').innerText = formatDurationHoursMins(durSec);
        if (t.capture_quality && !t.capture_quality.style_metrics_available) {
            for (const id of ['det-starts','det-brakes','det-idle','det-bumps']) document.getElementById(id).innerText = '—';
        }

        document.getElementById('details-modal').classList.add('active');
    }

    function closeDetailsModal() {
        document.getElementById('details-modal').classList.remove('active');
    }

    function handleBackdropClick(e) {
        if (e.target.id === 'details-modal') {
            closeDetailsModal();
        }
    }

    window.addEventListener('DOMContentLoaded', fetchHistory);
</script>
</body>
</html>
