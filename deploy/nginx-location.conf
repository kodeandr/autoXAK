# Include INSIDE the existing HTTPS `server` block for the app domain.
# Keep the existing server_name, listen and ssl_certificate settings.
# Replace an existing `location /` block rather than adding a duplicate.
location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    # Telemetry batches may be substantially larger than Nginx's default 1 MiB.
    client_max_body_size 150m;
}
