services:
  api:
    build: .
    container_name: autoXAK_backend_api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --ssl-keyfile /app/key.pem --ssl-certfile /app/cert.pem --reload
    environment:
      - SECRET_KEY=${SECRET_KEY:?Set a persistent random SECRET_KEY in .env}
      - YANDEX_ID_SALT=${YANDEX_ID_SALT:-}
      - ENABLE_YANDEX_DEMO=${ENABLE_YANDEX_DEMO:-false}
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql+asyncpg://autoXAK_user:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/autoXAK_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DGIS_API_KEY=${DGIS_API_KEY:-}
      - DGIS_USE_MOCK=${DGIS_USE_MOCK:-true}
      - YANDEX_CLIENT_ID=${YANDEX_CLIENT_ID:-}
      - YANDEX_CLIENT_SECRET=${YANDEX_CLIENT_SECRET:-}
      - YANDEX_REDIRECT_URI=${YANDEX_REDIRECT_URI:-https://autoxak.ru/api/v1/auth/yandex/callback}     

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: autoXAK_postgres
    environment:
      POSTGRES_USER: autoXAK_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: autoXAK_db
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoXAK_user -d autoXAK_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: autoXAK_redis
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  pgdata:
